name: Daily Job Scraper + Deploy

on:
  # Run every day at 7:00 AM IST (1:30 AM UTC)
  schedule:
    - cron: '30 1 * * *'

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      source:
        description: 'Scraper source (all / adzuna / manual)'
        required: false
        default: 'all'
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/scraper.py --source $SOURCE --dry-run
          else
            python scripts/scraper.py --source $SOURCE
          fi

      - name: Notify on failure
        if: failure()
        run: echo "❌ Scraper failed. Check the logs above."
